<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/pages/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="login-brand" href="/" aria-label="Cloudio dashboard">cloud<span>io</span></a>
    <h1>Sign in to the control plane</h1>
    <p class="login-copy">Use the platform token configured on this Cloudio instance.</p>
    <form id="login-form" class="login-form">
      <div class="field">
        <label for="platform-token">Platform token</label>
        <input id="platform-token" name="token" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>
      <button id="login-button" class="button-primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
