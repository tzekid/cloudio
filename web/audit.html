<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/pages/audit.js"></script>
</head>
<body>
  <main id="page-content">
    <p class="page-intro">Review control-plane mutations, their actor, result, request detail, and idempotency identity.</p>

    <section class="panel" aria-labelledby="audit-filters-title">
      <div class="panel-header">
        <h2 id="audit-filters-title">View controls</h2>
      </div>
      <div class="panel-body">
        <form class="toolbar" method="get" action="/audit.html">
          <div class="field">
            <label for="audit-limit">Limit</label>
            <select id="audit-limit" name="limit">
              <option>50</option>
              <option selected>100</option>
              <option>200</option>
              <option>500</option>
            </select>
          </div>
          <button id="reload-audit" type="submit">Reload entries</button>
          <label class="field-inline" for="audit-auto">
            <input id="audit-auto" type="checkbox">
            Auto-refresh every 10s
          </label>
          <span id="audit-updated" class="toolbar-meta" aria-live="polite"></span>
        </form>
      </div>
    </section>

    <div id="audit-notice" class="notice hidden" aria-live="polite"></div>

    <section class="panel" aria-labelledby="audit-log-title">
      <div class="panel-header">
        <h2 id="audit-log-title">Audit log</h2>
        <span id="audit-count" class="muted" aria-live="polite"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Actor</th>
              <th scope="col">Action</th>
              <th scope="col">Target</th>
              <th scope="col">Result</th>
              <th scope="col">Detail</th>
            </tr>
          </thead>
          <tbody id="audit-body">
            <tr><td class="empty-state loading-state" colspan="6">Loading audit entries…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
