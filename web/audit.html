<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <main id="page-content">
    <p class="page-intro">Review operator mutations and important control-plane failures from one redacted history.</p>

    <section class="panel" aria-labelledby="audit-filters-title">
      <div class="panel-header">
        <h2 id="audit-filters-title">View controls</h2>
      </div>
      <div class="panel-body">
        <form class="toolbar" method="get" action="/audit.html">
          <div class="field">
            <label for="audit-view">Entries</label>
            <select id="audit-view" name="view">
              <option value="important" selected>Mutations and failures</option>
              <option value="all">All events</option>
            </select>
          </div>
          <div class="field">
            <label for="audit-category">Category</label>
            <select id="audit-category" name="category">
              <option value="" selected>All categories</option>
              <option value="dashboard">Dashboard</option>
              <option value="projects">Projects</option>
              <option value="routes">Routes</option>
              <option value="dns">DNS</option>
              <option value="browser">Browser</option>
              <option value="vps">VPS</option>
              <option value="docker">Docker</option>
              <option value="security">Security</option>
              <option value="settings">Settings</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="audit-result">Result</label>
            <select id="audit-result" name="result">
              <option value="all" selected>All results</option>
              <option value="success">Success</option>
              <option value="failure">Failure</option>
            </select>
          </div>
          <div class="field">
            <label for="audit-window">Window</label>
            <select id="audit-window" name="window">
              <option value="1h">1 hour</option>
              <option value="24h" selected>24 hours</option>
              <option value="7d">7 days</option>
              <option value="30d">30 days</option>
              <option value="all">All time</option>
            </select>
          </div>
          <div class="field field-grow">
            <label for="audit-target">Target contains</label>
            <input id="audit-target" name="target" type="text" autocomplete="off">
          </div>
          <div class="field field-grow">
            <label for="audit-actor">Actor contains</label>
            <input id="audit-actor" name="actor" type="text" autocomplete="off">
          </div>
          <div class="field">
            <label for="audit-limit">Limit</label>
            <select id="audit-limit" name="limit">
              <option>50</option>
              <option selected>100</option>
              <option>200</option>
              <option>500</option>
            </select>
          </div>
          <button id="reload-audit" type="submit">Reload entries</button>
        </form>
      </div>
    </section>

    <div id="audit-notice" class="notice hidden" aria-live="polite"></div>

    <section class="panel" aria-labelledby="audit-log-title">
      <div class="panel-header">
        <h2 id="audit-log-title">Audit log</h2>
        <span id="audit-count" class="muted" aria-live="polite"></span>
      </div>
      <div class="table-scroll">
        <table class="responsive-table">
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Actor</th>
              <th scope="col">Action</th>
              <th scope="col">Target</th>
              <th scope="col">Result</th>
              <th scope="col">Detail</th>
            </tr>
          </thead>
          <tbody id="audit-body">
            <tr><td class="empty-state" colspan="6">No entries match this view.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
