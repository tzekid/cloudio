<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/pages/docker.js"></script>
</head>
<body>
  <main id="page-content">
    <p class="page-intro">Inspect local containers, run explicit lifecycle actions, and tail logs without leaving the control plane.</p>

    <div id="docker-notice" class="notice hidden" aria-live="polite"></div>

    <section class="panel" aria-labelledby="containers-title">
      <div class="panel-header">
        <h2 id="containers-title">Containers</h2>
        <button id="reload-containers" class="button-small" type="button">Reload list</button>
      </div>
      <div class="table-scroll">
        <table class="responsive-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Image</th>
              <th scope="col">Status</th>
              <th scope="col">Ports</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="containers-body">
            <tr><td class="empty-state loading-state" colspan="5">Loading containers…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel-body">
        <span id="container-status" class="status-message" aria-live="polite"></span>
      </div>
    </section>

    <section class="panel" aria-labelledby="logs-title">
      <div class="panel-header">
        <div>
          <h2 id="logs-title">Container logs</h2>
          <p id="logs-target">Select a container to view its logs.</p>
        </div>
      </div>
      <div class="panel-body stack">
        <div class="toolbar">
          <div class="field">
            <label for="log-tail">Tail</label>
            <select id="log-tail">
              <option>100</option>
              <option selected>200</option>
              <option>500</option>
            </select>
          </div>
          <button id="reload-logs" type="button">Reload logs</button>
          <span id="logs-status" class="status-message" aria-live="polite"></span>
        </div>
        <pre id="container-logs" class="log-viewer" data-state="empty">No logs loaded.</pre>
      </div>
    </section>
  </main>
</body>
</html>
