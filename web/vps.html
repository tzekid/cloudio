<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPS · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/pages/vps.js"></script>
</head>
<body>
  <main id="page-content">
    <p class="page-intro">Operate Hostinger machines and review the firewall state captured by Cloudio.</p>

    <div id="vps-notice" class="notice hidden" aria-live="polite"></div>
    <section aria-labelledby="machines-title">
      <h2 id="machines-title" class="section-heading">Machines</h2>
      <div id="machines" class="resource-grid">
        <div class="resource-card empty-state loading-state">Loading machines…</div>
      </div>
      <div id="machine-status" class="status-message" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="metrics-title">
      <div class="panel-header">
        <h2 id="metrics-title">Metrics</h2>
      </div>
      <div id="metrics" class="table-scroll">
        <div class="empty-state loading-state">Loading metrics…</div>
      </div>
    </section>

    <section class="panel" aria-labelledby="firewalls-title">
      <div class="panel-header">
        <div>
          <h2 id="firewalls-title">Firewalls</h2>
          <p>Review rules, edit existing entries, and sync a firewall to a machine.</p>
        </div>
      </div>
      <div class="panel-body">
        <div id="firewall-notice" class="notice hidden" aria-live="polite"></div>
        <div id="firewalls" class="stack">
          <div class="empty-state loading-state">Loading firewalls…</div>
        </div>

        <div class="subsection">
          <h3 class="section-heading">Add or update rule</h3>
          <form id="rule-form" class="form-grid">
            <div class="field span-2">
              <label for="rule-firewall">Firewall ID</label>
              <input id="rule-firewall" name="firewall_id" type="text" required autocomplete="off">
            </div>
            <div class="field span-2">
              <label for="rule-protocol">Protocol</label>
              <select id="rule-protocol" name="protocol">
                <option>TCP</option>
                <option>UDP</option>
                <option>ICMP</option>
                <option>any</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="rule-port">Port</label>
              <input id="rule-port" name="port" type="text" placeholder="443" autocomplete="off">
            </div>
            <div class="field span-3">
              <label for="rule-source">Source</label>
              <input id="rule-source" name="source" type="text" placeholder="any or 192.0.2.1" autocomplete="off">
            </div>
            <div class="field span-2">
              <label for="rule-action">Action</label>
              <select id="rule-action" name="action">
                <option>accept</option>
                <option>drop</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="rule-id">Rule ID for update</label>
              <input id="rule-id" name="rule_id" type="text" autocomplete="off">
            </div>
            <div class="span-12 cluster">
              <button id="add-rule" class="button-primary" type="submit">Add rule</button>
              <button id="update-rule" type="button">Update rule</button>
              <span id="rule-status" class="status-message" aria-live="polite"></span>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
