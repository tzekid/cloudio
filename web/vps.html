<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPS — cloudio</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/datastar.js"></script>
<script src="/assets/app.js"></script>
<style>
:root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --ok:#3fb950; --err:#f85149; --warn:#d29922; }
body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.layout { display:flex; min-height:100vh; }
.sidebar { width:180px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:12px 0; }
.sidebar .brand { padding:4px 16px 12px; font-weight:700; color:var(--accent); }
.sidebar a { display:block; padding:6px 16px; color:var(--muted); text-decoration:none; }
.sidebar a:hover { color:var(--fg); }
.sidebar a.active { color:var(--fg); background:var(--bg); border-left:2px solid var(--accent); }
.main { flex:1; padding:16px 20px; min-width:0; }
h1 { font-size:16px; margin:0 0 12px; }
h2 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
h3 { font-size:13px; margin:12px 0 6px; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px; margin-bottom:14px; }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--muted); font-weight:600; }
input,select,button { background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:4px 8px; font:inherit; }
button { cursor:pointer; }
button:hover { border-color:var(--accent); }
button.danger:hover { border-color:var(--err); color:var(--err); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.muted { color:var(--muted); }
.notice { padding:8px 10px; border:1px solid var(--warn); border-radius:4px; color:var(--warn); margin-bottom:10px; }
.notice.error { border-color:var(--err); color:var(--err); }
.hidden { display:none; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px; }
.card .name { font-weight:700; margin-bottom:4px; }
.pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; border:1px solid var(--border); }
.pill.running { color:var(--ok); border-color:var(--ok); }
.pill.stopped { color:var(--err); border-color:var(--err); }
.status-msg { margin-left:8px; }
.status-msg.ok { color:var(--ok); }
.status-msg.err { color:var(--err); }
.kv { margin:6px 0; }
.kv div { display:flex; gap:8px; }
.kv .k { color:var(--muted); min-width:60px; }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="brand">cloudio</div>
    <a href="/">Dashboard</a>
    <a href="/apps.html">Apps</a>
    <a href="/routes.html">Routes</a>
    <a href="/dns.html">DNS</a>
    <a href="/vps.html" class="active">VPS</a>
    <a href="/docker.html">Docker</a>
    <a href="/audit.html">Audit</a>
  </nav>
  <main class="main">
    <h1>VPS</h1>
    <div id="vps-notice" class="notice hidden"></div>
    <div id="machines" class="cards" style="margin-bottom:14px">
      <div class="muted">Loading machines…</div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <span id="action-status" class="status-msg"></span>
    </div>

    <div class="panel">
      <h2>Metrics</h2>
      <div id="metrics"><span class="muted">Loading…</span></div>
    </div>

    <div class="panel">
      <h2>Firewalls</h2>
      <div id="fw-notice" class="notice hidden"></div>
      <div id="firewalls"><span class="muted">Loading…</span></div>
      <h3>Add rule</h3>
      <form id="rule-form" class="row">
        <input id="rule-fw" placeholder="firewall id" required size="12">
        <select id="rule-protocol"><option>TCP</option><option>UDP</option><option>ICMP</option><option>any</option></select>
        <input id="rule-port" placeholder="port (e.g. 443)" size="12">
        <input id="rule-source" placeholder="source (e.g. any or 1.2.3.4)" size="18">
        <select id="rule-action"><option>accept</option><option>drop</option></select>
        <input id="rule-id" placeholder="rule id (for edit)" size="12">
        <button type="submit" id="rule-add">Add</button>
        <button type="button" id="rule-update">Update</button>
        <span id="rule-status" class="status-msg"></span>
      </form>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  async function plainFetch(url, opts) {
    const res = await fetch(url, opts);
    const text = await res.text();
    let body = null;
    try { body = JSON.parse(text); } catch (_) {}
    if (!res.ok) {
      const err = new Error("HTTP " + res.status + " " + url);
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  }
  function fetchJson(url, opts) {
    const fn = (window.cloudio && window.cloudio.fetchJson) ? window.cloudio.fetchJson : plainFetch;
    return fn(url, opts);
  }
  const $ = (id) => document.getElementById(id);
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function setStatus(id, ok, msg) {
    const el = $(id);
    el.textContent = msg;
    el.className = "status-msg " + (ok ? "ok" : "err");
    setTimeout(() => { el.textContent = ""; }, 6000);
  }
  function notice(id, msg, isError) {
    const el = $(id);
    if (!msg) { el.className = "notice hidden"; return; }
    el.textContent = msg;
    el.className = "notice" + (isError ? " error" : "");
  }
  async function writeCall(method, url, payload, statusId, okMsg) {
    try {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (payload) opts.body = JSON.stringify(payload);
      const res = await fetchJson(url, opts);
      const ok = res && res.ok !== false;
      setStatus(statusId, ok, ok ? okMsg : "failed (status " + (res && res.status) + ")");
      return ok;
    } catch (e) {
      setStatus(statusId, false, e.status === 404 ? "endpoint not available yet" : "error: " + e.message);
      return false;
    }
  }

  let actionable = true;

  function pillClass(status) {
    const s = String(status || "").toLowerCase();
    if (s.includes("run") || s.includes("active")) return "running";
    if (s.includes("stop") || s.includes("off")) return "stopped";
    return "";
  }

  function renderMachines(machines) {
    const wrap = $("machines");
    if (!machines.length) {
      wrap.innerHTML = '<div class="muted">No machines found.</div>';
      return;
    }
    wrap.innerHTML = machines.map((m) => {
      const buttons = actionable
        ? '<div class="row" style="margin-top:8px">' +
          '<button class="vm-act" data-id="' + esc(m.id) + '" data-action="start">Start</button>' +
          '<button class="vm-act" data-id="' + esc(m.id) + '" data-action="stop">Stop</button>' +
          '<button class="vm-act danger" data-id="' + esc(m.id) + '" data-action="restart">Restart</button></div>'
        : '<div class="muted" style="margin-top:8px">actions unavailable (read-only data)</div>';
      return '<div class="card"><div class="name">' + esc(m.name || m.id) +
        ' <span class="pill ' + pillClass(m.status) + '">' + esc(m.status) + "</span></div>" +
        '<div class="kv"><div><span class="k">ipv4</span><span>' + esc(m.ipv4) + "</span></div>" +
        '<div><span class="k">plan</span><span>' + esc(m.plan) + "</span></div>" +
        '<div><span class="k">id</span><span>' + esc(m.id) + "</span></div></div>" + buttons + "</div>";
    }).join("");
  }

  async function loadMachines() {
    notice("vps-notice", null);
    try {
      const data = await fetchJson("/api/vps");
      actionable = true;
      renderMachines(data.machines || []);
      return;
    } catch (_) { /* fall back to dashboard data */ }
    try {
      const dash = await fetchJson("/api/dashboard?section=vps");
      const items = (dash.sections && dash.sections.vps && dash.sections.vps.items) || [];
      actionable = true; // action endpoint may still exist; show buttons, errors surface on click
      renderMachines(items);
      notice("vps-notice", "/api/vps not available yet — showing snapshot data from /api/dashboard.", false);
    } catch (e) {
      notice("vps-notice", "VPS endpoints not available yet.", true);
      $("machines").innerHTML = "";
    }
  }

  $("machines").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button.vm-act");
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if ((action === "stop" || action === "restart") &&
        !confirm(action.charAt(0).toUpperCase() + action.slice(1) + " machine " + id + "?")) return;
    writeCall("POST", "/api/vps/action", { vm_id: id, action }, "action-status", action + " requested")
      .then((ok) => { if (ok) setTimeout(loadMachines, 1500); });
  });

  async function loadMetrics() {
    try {
      const dash = await fetchJson("/api/dashboard?section=vps");
      const metrics = (dash.sections && dash.sections.vps && dash.sections.vps.metrics) || [];
      if (!metrics.length) {
        $("metrics").innerHTML = '<span class="muted">No metric rows.</span>';
        return;
      }
      $("metrics").innerHTML = "<table><thead><tr><th>VM</th><th>Metric</th><th>Samples</th><th>Latest captured</th></tr></thead><tbody>" +
        metrics.map((m) => "<tr><td>" + esc(m.vm_id) + "</td><td>" + esc(m.metric) + "</td><td>" +
          esc(m.count) + "</td><td>" + esc(m.latest_captured) + "</td></tr>").join("") +
        "</tbody></table>";
    } catch (_) {
      $("metrics").innerHTML = '<span class="muted">Metrics unavailable.</span>';
    }
  }

  function kvTable(obj) {
    return "<table><tbody>" + Object.entries(obj).map(([k, v]) => {
      const val = (v !== null && typeof v === "object") ? JSON.stringify(v) : v;
      return '<tr><td class="muted" style="width:160px">' + esc(k) + "</td><td>" + esc(val) + "</td></tr>";
    }).join("") + "</tbody></table>";
  }

  async function loadFirewalls() {
    notice("fw-notice", null);
    try {
      const data = await fetchJson("/api/firewalls");
      const fws = data.firewalls || [];
      if (!fws.length) {
        $("firewalls").innerHTML = '<span class="muted">No firewalls.</span>';
        return;
      }
      $("firewalls").innerHTML = fws.map((fw) => {
        const id = fw.id != null ? fw.id : "";
        const rules = fw.rules || [];
        const rulesHtml = rules.length
          ? "<table><thead><tr><th>ID</th><th>Protocol</th><th>Port</th><th>Source</th><th>Action</th><th></th></tr></thead><tbody>" +
            rules.map((r) => "<tr><td>" + esc(r.id) + "</td><td>" + esc(r.protocol) + "</td><td>" +
              esc(r.port) + "</td><td>" + esc(r.source != null ? r.source : r.source_detail) + "</td><td>" + esc(r.action) + "</td>" +
              '<td><button class="danger rule-del" data-fw="' + esc(id) + '" data-rule="' + esc(r.id) + '">delete</button> ' +
              '<button class="rule-edit" data-fw="' + esc(id) + '" data-rule="' + esc(r.id) + '" data-protocol="' + esc(r.protocol) + '" data-port="' + esc(r.port) + '" data-source="' + esc(r.source != null ? r.source : "") + '" data-action-val="' + esc(r.action) + '">edit</button></td></tr>').join("") +
            "</tbody></table>"
          : '<div class="muted">No rules field; raw fields below.</div>' + kvTable(fw);
        return '<div style="margin-bottom:12px"><h3>Firewall ' + esc(fw.name || id) + " (id " + esc(id) + ")" +
          ' <button class="fw-sync" data-fw="' + esc(id) + '">Sync</button>' +
          ' <input class="fw-sync-vm" data-fw="' + esc(id) + '" placeholder="vm id" size="10"></h3>' +
          rulesHtml + "</div>";
      }).join("");
    } catch (e) {
      $("firewalls").innerHTML = "";
      notice("fw-notice", e.status === 404 ? "Firewall endpoint not available yet." : "Failed to load firewalls: " + e.message, true);
    }
  }

  $("firewalls").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button");
    if (!btn) return;
    if (btn.classList.contains("rule-del")) {
      if (!confirm("Delete rule " + btn.dataset.rule + "?")) return;
      writeCall("DELETE", "/api/firewall/rule?firewall_id=" + encodeURIComponent(btn.dataset.fw) +
        "&rule_id=" + encodeURIComponent(btn.dataset.rule), null, "rule-status", "rule deleted")
        .then((ok) => { if (ok) loadFirewalls(); });
    } else if (btn.classList.contains("rule-edit")) {
      $("rule-fw").value = btn.dataset.fw;
      $("rule-id").value = btn.dataset.rule;
      $("rule-protocol").value = btn.dataset.protocol || "TCP";
      $("rule-port").value = btn.dataset.port || "";
      $("rule-source").value = btn.dataset.source || "";
      $("rule-action").value = btn.dataset.actionVal || "accept";
      $("rule-form").scrollIntoView({ behavior: "smooth" });
    } else if (btn.classList.contains("fw-sync")) {
      const vm = btn.parentElement.querySelector(".fw-sync-vm").value.trim();
      if (!vm) { setStatus("rule-status", false, "enter a vm id to sync"); return; }
      writeCall("POST", "/api/firewall/sync", { firewall_id: numOrStr(btn.dataset.fw), vm_id: numOrStr(vm) }, "rule-status", "sync requested");
    }
  });

  function numOrStr(v) { const n = Number(v); return Number.isFinite(n) && String(n) === String(v).trim() ? n : v; }

  function ruleFromForm() {
    return {
      protocol: $("rule-protocol").value,
      port: $("rule-port").value.trim(),
      source: $("rule-source").value.trim(),
      action: $("rule-action").value,
    };
  }

  $("rule-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    writeCall("POST", "/api/firewall/rule",
      { firewall_id: numOrStr($("rule-fw").value.trim()), rule: ruleFromForm() },
      "rule-status", "rule added").then((ok) => { if (ok) loadFirewalls(); });
  });
  $("rule-update").addEventListener("click", () => {
    const rid = $("rule-id").value.trim();
    if (!rid) { setStatus("rule-status", false, "rule id required for update"); return; }
    writeCall("PUT", "/api/firewall/rule",
      { firewall_id: numOrStr($("rule-fw").value.trim()), rule_id: numOrStr(rid), rule: ruleFromForm() },
      "rule-status", "rule updated").then((ok) => { if (ok) loadFirewalls(); });
  });

  loadMachines();
  loadMetrics();
  loadFirewalls();
})();
</script>
</body>
</html>
