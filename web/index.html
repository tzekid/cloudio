<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/pages/dashboard.js"></script>
</head>
<body>
  <main id="page-content">
    <p class="page-intro">A compact view of how public DNS, local routes, services, and containers line up.</p>

    <section class="panel" aria-labelledby="dashboard-filters-title">
      <div class="panel-header">
        <h2 id="dashboard-filters-title">View controls</h2>
      </div>
      <div class="panel-body">
        <form class="toolbar" method="get" action="/">
          <div class="field field-grow">
            <label for="domain-filter">Domain filter</label>
            <input id="domain-filter" name="domain" type="text" placeholder="example.com" autocomplete="off">
          </div>
          <label class="field-inline" for="issues-only">
            <input id="issues-only" name="issues" value="1" type="checkbox">
            Issues only
          </label>
          <button id="dashboard-reload" type="submit">Apply view</button>
          <span id="last-refresh" class="toolbar-meta" aria-live="polite"></span>
        </form>
      </div>
    </section>

    <section id="summary-cards" class="summary-grid" aria-label="Topology summary">
      <div class="stat-card">
        <div class="stat-value">—</div>
        <div class="stat-label">Loading</div>
      </div>
    </section>

    <section class="panel" aria-labelledby="topology-title">
      <div class="panel-header">
        <div>
          <h2 id="topology-title">Topology</h2>
          <p>Provider and local infrastructure reconciliation.</p>
        </div>
      </div>
      <div class="table-scroll">
        <table aria-describedby="topology-title">
          <thead>
            <tr>
              <th scope="col">Status</th>
              <th scope="col">Host</th>
              <th scope="col">DNS match</th>
              <th scope="col">Exposure</th>
              <th scope="col">Upstream</th>
              <th scope="col">Service</th>
              <th scope="col">Container</th>
              <th scope="col">Issues</th>
            </tr>
          </thead>
          <tbody id="topology-body">
            <tr><td class="empty-state loading-state" colspan="8">Loading topology…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
