<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNS · Cloudio</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
  <script defer src="/assets/pages/dns.js"></script>
</head>
<body>
  <main id="page-content">
    <p class="page-intro">Inspect and manage Cloudflare DNS records and the zone settings Cloudio uses for public traffic.</p>

    <section class="panel" aria-labelledby="dns-zone-title">
      <div class="panel-header">
        <h2 id="dns-zone-title">Zone</h2>
      </div>
      <div class="panel-body">
        <form id="domain-form" class="toolbar" method="get" action="/dns.html">
          <div class="field field-grow">
            <label for="domain">Domain</label>
            <input id="domain" name="domain" type="text" placeholder="example.com" required autocomplete="off">
          </div>
          <button id="load-domain" type="submit">Load records</button>
          <span id="source-note" class="toolbar-meta"></span>
        </form>
      </div>
    </section>

    <div id="dns-notice" class="notice hidden" aria-live="polite"></div>

    <section class="panel" aria-labelledby="records-title">
      <div class="panel-header">
        <h2 id="records-title">Records</h2>
        <span id="record-count" class="muted" aria-live="polite"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">Type</th>
              <th scope="col">Name</th>
              <th scope="col">Content</th>
              <th scope="col">TTL</th>
              <th scope="col">Proxy</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr><td class="empty-state loading-state" colspan="6">Loading DNS records…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="add-record-panel" aria-labelledby="add-record-title">
      <div class="panel-header">
        <h2 id="add-record-title">Add record</h2>
      </div>
      <div class="panel-body">
        <form id="add-record-form" class="form-grid">
          <div class="field span-2">
            <label for="record-type">Type</label>
            <select id="record-type" name="type">
              <option>A</option>
              <option>AAAA</option>
              <option>CNAME</option>
              <option>TXT</option>
              <option>MX</option>
            </select>
          </div>
          <div class="field span-3">
            <label for="record-name">Name</label>
            <input id="record-name" name="name" type="text" placeholder="www" required autocomplete="off">
          </div>
          <div class="field span-4">
            <label for="record-content">Content</label>
            <input id="record-content" name="content" type="text" placeholder="192.0.2.10" required autocomplete="off">
          </div>
          <div class="field span-2">
            <label for="record-ttl">TTL</label>
            <input id="record-ttl" name="ttl" type="number" value="1" min="1">
          </div>
          <label class="field-inline" for="record-proxied">
            <input id="record-proxied" name="proxied" type="checkbox">
            Proxied
          </label>
          <div class="span-12 cluster">
            <button id="add-record" class="button-primary" type="submit">Add record</button>
            <span id="record-status" class="status-message" aria-live="polite"></span>
          </div>
        </form>
      </div>
    </section>

    <section class="panel" aria-labelledby="zone-tools-title">
      <div class="panel-header">
        <div>
          <h2 id="zone-tools-title">Zone tools</h2>
          <p>Apply focused settings to the loaded zone.</p>
        </div>
      </div>
      <div class="panel-body stack">
        <div class="toolbar">
          <div class="field">
            <span class="field-label">Cache</span>
            <button id="purge-cache" class="button-danger" type="button">Purge entire cache</button>
          </div>
          <span id="purge-status" class="status-message" aria-live="polite"></span>
        </div>
        <div class="toolbar">
          <div class="field">
            <label for="ssl-mode">SSL mode</label>
            <select id="ssl-mode">
              <option value="off">Off</option>
              <option value="flexible">Flexible</option>
              <option value="full">Full</option>
              <option value="strict">Strict</option>
            </select>
          </div>
          <button id="apply-ssl" type="button">Apply SSL mode</button>
          <span id="ssl-status" class="status-message" aria-live="polite"></span>
        </div>
        <div class="toolbar">
          <div class="field">
            <span class="field-label">Always use HTTPS</span>
            <div class="cluster">
              <button id="https-on" type="button">Enable</button>
              <button id="https-off" type="button">Disable</button>
            </div>
          </div>
          <span id="https-status" class="status-message" aria-live="polite"></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
