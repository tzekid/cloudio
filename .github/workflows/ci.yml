name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout private Nob dependency
        env:
          NOB_SSH_KEY: ${{ secrets.NOB_SSH_KEY }}
        run: |
          key_path="$RUNNER_TEMP/cloudio-nob-deploy-key"
          known_hosts_path="$RUNNER_TEMP/cloudio-github-known-hosts"
          install -m 600 /dev/null "$key_path"
          install -m 600 /dev/null "$known_hosts_path"
          trap 'shred -u "$key_path" "$known_hosts_path"' EXIT
          printf '%s\n' "$NOB_SSH_KEY" > "$key_path"
          curl --fail --silent --show-error https://api.github.com/meta |
            python3 -c 'import json, sys; print("\n".join("github.com " + key for key in json.load(sys.stdin)["ssh_keys"]))' \
            > "$known_hosts_path"
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_path" \
            git submodule update --init --recursive
      - id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}
      - run: zig build --system zig-pkg check -j2
      - run: bash tests/setup-browser-e2e.sh
      - run: zig build --system zig-pkg -Doptimize=ReleaseSafe product-acceptance -j2
