name: Provider mirrors

on:
  push:
    branches: [master]
    paths:
      - packages/cloudflare/**
      - packages/hostinger/**
      - tools/provider-package-check.sh
      - tools/publish-provider-mirror.sh
      - .github/workflows/provider-mirrors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: tools/provider-package-check.sh cloudflare
      - run: tools/publish-provider-mirror.sh cloudflare tzekid/cloudflare-zig
        env:
          MIRROR_SSH_KEY: ${{ secrets.CLOUDFLARE_MIRROR_SSH_KEY }}

  hostinger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: tools/provider-package-check.sh hostinger
      - run: tools/publish-provider-mirror.sh hostinger tzekid/hostinger-zig
        env:
          MIRROR_SSH_KEY: ${{ secrets.HOSTINGER_MIRROR_SSH_KEY }}
