name: Provider mirrors

on:
  push:
    branches: [master]
    paths:
      - packages/cloudflare/**
      - packages/hostinger/**
      - tools/provider-package-check.sh
      - tools/publish-provider-mirror.sh
      - .github/workflows/provider-mirrors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: cloudflare
            mirror: tzekid/cloudflare-zig
            key: CLOUDFLARE_MIRROR_SSH_KEY
          - package: hostinger
            mirror: tzekid/hostinger-zig
            key: HOSTINGER_MIRROR_SSH_KEY
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verification dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}
      - run: tools/provider-package-check.sh ${{ matrix.package }}
      - run: tools/publish-provider-mirror.sh ${{ matrix.package }} ${{ matrix.mirror }}
        env:
          MIRROR_SSH_KEY: ${{ secrets[matrix.key] }}
